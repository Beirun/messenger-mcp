[package]
name = "messenger-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
messenger-cli = { git = "https://github.com/Beirun/messenger-cli", rev = "7021c799e462052f7cf230feed79a70bb96bdbc8" }
rmcp = { version = "3.10", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
