[package]
name = "messenger-mcp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
futures-util = "0.3.34"
messenger-client = { git = "https://github.com/rgryta/messenger-sync", rev = "4dc955ee8e2a809b13069f43e9a4f345a495f00b", version = "0.2.9" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.10", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
